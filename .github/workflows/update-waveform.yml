name: Update Real-Time GitHub Activity Waveform

on:
  schedule:
    # Run automatically every day at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab
  push:
    branches:
      - main
    paths:
      - 'scripts/update_waveform.py'

jobs:
  update-waveform:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate Live Waveform SVG
        run: python3 scripts/update_waveform.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add github-activity-waveform.svg
          if git diff --staged --quiet; then
            echo "No changes in waveform data."
          else
            git commit -m "chore(activity): update real-time activity waveform [skip ci]"
            git push origin main
          fi
