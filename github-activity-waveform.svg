    <text x="278" y="20" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">Heatmap</text>
  </g>

  <rect x="35" y="100" width="830" height="235" rx="14" fill="#030712" stroke="#1e293b" stroke-width="1.2"/>

