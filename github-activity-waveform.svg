<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Plus Jakarta Sans', Roboto, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="waveGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0.0"/>
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect x="10" y="10" width="880" height="400" rx="20" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" filter="url(#softShadow)"/>

  <g transform="translate(35, 45)">
    <rect x="0" y="0" width="36" height="36" rx="10" fill="#0284c7"/>
    <path d="M18 9c-5 0-9 4-9 9 0 4 2.5 7.5 6 8.7.4.1.6-.2.6-.4v-1.5c-2.5.5-3-1.2-3-1.2-.4-1-.1-1.3-.1-1.3-.8-.5.1-.5.1-.5.9.1 1.4 1 1.4 1 .8 1.4 2.1 1 2.6.8.1-.6.3-1 .6-1.2-2-.2-4.1-1-4.1-4.5 0-1 .3-1.8 1-2.5-.1-.2-.4-1.1.1-2.4 0 0 .8-.3 2.6 1a9 9 0 0 1 4.8 0c1.8-1.3 2.6-1 2.6-1 .5 1.3.2 2.2.1 2.4.7.7 1 1.5 1 2.5 0 3.5-2.1 4.3-4.1 4.5.4.3.7.9.7 1.9v2.8c0 .2.2.5.6.4A9 9 0 0 0 27 18c0-5-4-9-9-9z" fill="#ffffff" transform="translate(-9, -9) scale(1)"/>

    <text x="48" y="22" font-size="20" font-weight="800" fill="#f8fafc" letter-spacing="-0.5">407 contributions in the last year</text>
    <text x="48" y="38" font-size="13" font-weight="600" fill="#94a3b8">Real GitHub Activity • @24-Harshdeep</text>
  </g>

  <g transform="translate(480, 42)">
    <rect x="0" y="0" width="160" height="32" rx="8" fill="#1e293b"/>
    <rect x="3" y="3" width="54" height="26" rx="6" fill="#0284c7"/>
    <text x="30" y="20" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">1 Month</text>
    <text x="85" y="20" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">3 Months</text>
