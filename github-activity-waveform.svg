  <line x1="35" y1="300" x2="865" y2="300" stroke="#334155" stroke-width="1.5" stroke-dasharray="2 2"/>

  <g transform="translate(35, 45)">
    <path d="M 55.0 155.0 C 96.4 155.0, 137.8 155.0, 179.3 155.0 C 220.7 155.0, 262.1 155.0, 303.4 155.0 C 344.8 155.0, 386.2 155.0, 427.6 155.0 C 469.0 155.0, 510.3 155.0, 551.7 155.0 C 593.1 155.0, 634.5 155.0, 675.9 155.0 C 717.2 155.0, 758.6 155.0, 800.0 155.0 L 800.0 155.0 L 0 155.0 Z" fill="url(#waveGradient)" />
